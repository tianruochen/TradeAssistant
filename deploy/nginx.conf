# Nginx 反代 + HTTPS 模板 —— /etc/nginx/conf.d/tradeassistant.conf
# 用法:
#   1) 改 server_name 为你的域名;先只留 80 段,certbot 会自动加 443+证书:
#        sudo certbot --nginx -d your.domain.com
#   2) 把 config.yaml 的 server.host 改成 127.0.0.1(只让 nginx 能连,8760 不对公网),重启服务
#   3) 阿里云安全组只放行 443/80,关掉 8760
server {
    listen 80;
    server_name your.domain.com;

    location / {
        proxy_pass http://127.0.0.1:8760;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # —— SSE 流式(豆包式吐字)必需 ——
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}

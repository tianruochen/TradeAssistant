# TradeAssistant 配置
# 主 + 子 agent 共享的默认模型；单个 agent 可在其 agents/<name>/agent.yaml 覆盖。

model:
  provider: deepseek       # 适配器按模型名自动选
  name: deepseek-v4-flash  # 主 agent(Alpha)：新中转实测——质量好/快/稳/真思考,老中转的空返回·丢工具·交付不出全解决
  sub_agent: deepseek-v4-flash  # 专家子 agent:同款,快且可靠
  base_url: http://124.220.67.137:3000/v1
  # api_key 从 secrets.env 的 LLM_API_KEY 读；用户级 key 存 users.db

server:
  host: 0.0.0.0
  port: 8760                # TradeAssistant 独立端口(digital-life 用 8642)

data_dir: data              # holdings.md / watchlist.md / 交易策略.md / holdings_history/

# 主 agent + 专家子 agent。扩展新专家 = 在此加一条 + 建 agents/<name>/。
agents:
  primary: alpha             # 主对话 agent
  experts:                  # 可被主 agent 通过 consult_<name> 工具调用的专家
    - hunter                # 机会挖掘
    - risk                  # 风控
    - ledger                # 持仓账本 / 翻倍进度

# 港股→CNY 汇率(持仓换算)。实测券商(用户实盘)折算率≈0.86,以匹配券商 CNY 市值口径
fx:
  hkd_cny: 0.86
